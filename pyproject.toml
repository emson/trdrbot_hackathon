[project]
name = "trdrbot"
version = "0.1.0"
description = "AI options trading agent for the Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "elfmem[tools]",
    "yfinance>=1.7.0",
    "langchain-openai>=1.6.0",
]

[project.scripts]
trdrbot = "trdrbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trdrbot"]

[tool.uv.sources]
elfmem = { git = "https://github.com/emson/elfmem.git", branch = "elfmem_index" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Network is DISABLED by default. Our bugs live at integration seams, so a test
# that quietly reaches a real API is both slow and a lie about what it proves;
# contract tests re-enable it explicitly per test.
addopts = "-m 'not contract' --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
markers = [
    "contract: verifies a belief about an EXTERNAL service (real network, real keys). Opt-in: `-m contract`.",
    "slow: takes more than a second or two.",
]
