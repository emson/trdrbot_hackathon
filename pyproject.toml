[project]
name = "trdrbot"
version = "0.1.0"
description = "AI options trading agent for the Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "elfmem[tools]>=0.20.0",
    "yfinance>=1.7.0",
    "langchain-openai>=1.6.0",
]

[project.scripts]
trdrbot = "trdrbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trdrbot"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "types-pyyaml>=6.0.12.20260815",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ earns its place here specifically: `date.today()` and a naive
# `datetime.now()` answer a question about the MACHINE's timezone, which is
# never the question this system is asking. Use ids.today() for anything
# compared against UTC-stamped data, ids.market_today() for anything meaning
# "the trading day" (D-091).
select = ["E", "F", "B", "SIM", "UP", "I", "DTZ"]
# NOT enabled: PLW1514 (unspecified-encoding), which would keep the D-092
# encoding sweep swept mechanically. It requires ruff's `preview = true`, and
# that enables a raft of unstable rules across the whole tree for one check.
# Revisit when it stabilises; until then the sweep is held by the test in
# tests/test_wiki_store.py that round-trips non-ASCII through a real page.
ignore = [
    # Long rationale comments are house style - they carry measured incident
    # history and reflowing them loses the shape a reader scans for.
    "E501",
    # `l` is this codebase's name for an option LEG, in a package where the
    # domain word appears on nearly every line of the maths. 43 renames across
    # functions that regression tests read by source is churn against zero
    # correctness gain.
    "E741",
    # SIM103/SIM108 fight this project's own stated style: "guard clauses and
    # early returns" and explicit branches for domain distinctions
    # (principles_coding.md pattern 2). `return not (high is not None and
    # price > high)` and a ternary over C-vs-P are both harder to read than
    # what they replace, so the rule loses to the principle rather than being
    # worked around per-line.
    "SIM103",
    "SIM108",
    # zip(strict=) would be a real decision per call site: strict=True changes
    # behaviour on a length mismatch, strict=False is a no-op annotation across
    # 16 sites. Deferred deliberately rather than swept.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# A test constructing a relative date from the machine's clock is fine - the
# rule exists to stop PRODUCTION code silently asking the wrong question.
"tests/*" = ["DTZ"]

[tool.mypy]
files = ["src/trdrbot"]
python_version = "3.11"
# langchain / langgraph / elfmem / yfinance ship no stubs; typing our own code
# is the point, not re-deriving theirs.
ignore_missing_imports = true

# The pure numeric core is held to strict. These are the modules where a
# `float | None` handled as a zero becomes a wrong number rather than a
# crash - the absence-as-zero class this project keeps re-finding (D-038).
[[tool.mypy.overrides]]
module = [
    "trdrbot.calibration",
    "trdrbot.ids",
    "trdrbot.failures",
    "trdrbot.lock",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network is DISABLED by default. Our bugs live at integration seams, so a test
# that quietly reaches a real API is both slow and a lie about what it proves;
# contract tests re-enable it explicitly per test.
addopts = "-m 'not contract' --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
markers = [
    "contract: verifies a belief about an EXTERNAL service (real network, real keys). Opt-in: `-m contract`.",
    "slow: takes more than a second or two.",
]
