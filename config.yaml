# trdrbot configuration.
# The model is a config value, not a code constant (D-008) - swapping providers
# is an edit here, and every journalled decision records which model made it.

llm:
  # LangChain "provider:model" form. Model IDs are complete as-is; never append
  # a date suffix. `init_chat_model` IS the provider registry, so adding a
  # provider is a line here plus (usually) one package - no code changes.
  #
  # ORDERED FALLBACK CHAIN: first model that answers wins. Verified live that
  # an exhausted-credit 400 from one provider falls through to the next.
  #
  # Grok-4.6 via OpenCode Zen is the PRIMARY (2026-08-28, superseding the
  # GLM-5.2 migration below): Claude and GPT-5 stay in the chain as fallback,
  # not removed, so nothing about the verified fallback behaviour changes if
  # Zen or xAI is unreachable. "opencode_zen:" is not a real LangChain
  # provider prefix - it is resolved by `Config.resolve_model_spec` (below
  # `providers:`) to OpenAI's builtin provider pointed at Zen's own base_url
  # and key, because Zen serves every model over the identical
  # /v1/chat/completions contract ChatOpenAI already speaks. Swapping the
  # model was a one-line edit for exactly that reason - no code change.
  #
  # STATUS AT THIS EDIT (verified live, not assumed): Zen's own /v1/models
  # catalog confirms "grok-4.6" is the correct id, and the SAME key serves
  # glm-5.2 successfully - but grok-4.6 itself returned a clean HTTP 500
  # three times running, and grok-4.5 (same family) returned 503 "Endpoint
  # is unavailable". That is Zen's/xAI's own availability, not a config
  # mistake here. Left as the declared primary anyway because the fallback
  # chain is proven to catch a real HTTP error (unlike GLM-5.2's silent
  # empty-completion failure below) and falls through to Claude/GPT-5 with
  # no risk to live decisions - but every cycle currently pays one wasted
  # call for it. Re-run `uv run trdrbot doctor` before trusting this is
  # actually serving; if it is still down, drop it a rung rather than pay
  # the latency (I-25).
  #
  # GLM-5.2 tried first (2026-08-28): reliable for simple prompts but proven
  # to exhaust its ENTIRE completion budget on invisible reasoning tokens for
  # the muse's actual prompt - finish_reason="length", 8000/8000 output
  # tokens spent, ZERO visible characters, reproduced deterministically on a
  # ~925-token input nowhere near any context limit. Unlike a real HTTP
  # error this does NOT trigger LangChain's fallback (the call "succeeds"
  # with useless content), so it was silently producing 0 candidates every
  # muse run while it sat in this chain. No documented lever was found to
  # bound it (contrast Grok's `reasoning_effort`, tested below). Demoted
  # out of the active chain rather than deleted from pricing/history.
  models:
    - "opencode_zen:grok-4.6"
    - "anthropic:claude-opus-5"
    - "openai:gpt-5"
  max_tokens: 8000

  # Config-level providers that are NOT one of init_chat_model's builtin
  # prefixes - an OpenAI-compatible gateway with its own endpoint and key.
  # `langchain_provider` names which builtin actually serves the traffic;
  # `base_url`/`api_key_env` are threaded into that provider's constructor
  # for THIS spec only, so other `openai:*` entries above are untouched.
  providers:
    opencode_zen:
      langchain_provider: "openai"
      base_url: "https://opencode.ai/zen/v1"
      api_key_env: "ZEN_API_KEY"

  # Optional per-role chains. A role not listed uses `models` above.
  # decide wants the strongest reasoning; the rest are synthesis and can run
  # cheaper without weakening the trade decision itself.
  roles:
    decide: ["opencode_zen:grok-4.6", "anthropic:claude-opus-5", "openai:gpt-5"]
    research: ["opencode_zen:grok-4.6", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    discovery: ["opencode_zen:grok-4.6", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    muse: ["opencode_zen:grok-4.6", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    doctor: ["openai:gpt-4o-mini"]
    # High-volume, low-difficulty (structured extraction, not judgement) - the
    # cheapest tier, with the synthesis tier as fallback (D-066).
    news_extract: ["openai:gpt-4o-mini", "openai:gpt-5-mini"]

  # USD per MILLION tokens. OPERATOR-SUPPLIED - verify against your provider's
  # current published rates; these are not fetched and will go stale. A model
  # missing here is reported as UNPRICED, never counted as free (D-062).
  #
  # GLM-5.2 and Grok-4.6 figures sourced from third-party trackers (pricing
  # calculators, model-routing aggregators), NOT Zen's own pricing page
  # directly - its marketing page states "transparent pricing, zero markups"
  # but did not itself list a per-token rate when checked. Grok-4.6's number
  # is corroborated by TWO independent sources agreeing exactly ($2/$6/$0.50
  # cache) - one describing xAI's own direct API, one describing it
  # specifically via Zen - which is stronger evidence than GLM-5.2 had, but
  # still not Zen's own page. Flagged rather than silently trusted;
  # re-verify against the live invoice before this matters for real spend.
  # Cached input has its own rate below 200K-token prompts; not modelled
  # separately here (usage.py has no cached-tier concept), so real cost on
  # a cache-heavy workload will run below this number, never above it.
  pricing:
    "opencode_zen:grok-4.6": {input: 2.00, output: 6.00}
    "grok-4.6": {input: 2.00, output: 6.00}
    "opencode_zen:glm-5.2": {input: 1.40, output: 4.40}
    "glm-5.2": {input: 1.40, output: 4.40}
    "anthropic:claude-opus-5": {input: 15.0, output: 75.0}
    "openai:gpt-5": {input: 1.25, output: 10.0}
    "openai:gpt-5-mini": {input: 0.25, output: 2.0}
    "openai:gpt-4o-mini": {input: 0.15, output: 0.60}

alpaca:
  # The MCP server runs as a local stdio subprocess (verified: Alpaca's hosted
  # MCP endpoint is OAuth-interactive-only, unusable headless).
  command: "uvx"
  args: ["alpaca-mcp-server"]
  paper: true

polymarket:
  # Macro questions whose odds move SPY. Read-only, no auth, no cost.
  # Free-text relevance search - Gamma's default ranking, deliberately
  # unsorted (sort=volume destroys relevance, verified live).
  queries:
    - "fed rate cut"
    - "us recession"
    - "cpi inflation"

research:
  # The universe the daily research cycle covers. Liquid, optionable, and
  # chosen for LOW MUTUAL CORRELATION - measured, not assumed (D-053).
  #
  # The previous universe (SPY/QQQ/NVDA) had a mean pairwise correlation of
  # 0.75 over the last 120 sessions, with SPY/QQQ at 0.92. That is one bet
  # wearing three hats: researching it produced three views on the same
  # factor, and the per-underlying risk cap could not see that.
  #
  # Measured vs SPY over the same window: XLE -0.42, XLP -0.04, XLV +0.16.
  # QQQ dropped as redundant with SPY. Discovery still nominates any liquid
  # name freely; this list is only what gets researched every day.
  universe: ["SPY", "NVDA", "XLE", "XLV", "XLP"]

events:
  # Known macro events. Dates here are RULE-DERIVED or user-verified, never
  # model memory (D-032's date discipline). Payrolls = first Friday of the
  # month - arithmetic, not recall. Note the collision: payrolls lands ON
  # the competition deadline day.
  - { date: "2026-09-04", name: "US nonfarm payrolls (first Friday - rule-derived); also the competition deadline" }

trading:
  watchlist: ["SPY"]
  # Force-close everything on/after this date regardless of position expiry
  # (D-019). Without it a conventional-DTE position never resolves inside the
  # competition and the learning loop produces nothing.
  deadline: "2026-09-04"

decide:
  # Tools bound to the decide agent. Binding all 72 MCP tools cost ~21k tokens
  # of schemas PER LLM CALL, ~71% of it for tools never used once - and a
  # larger tool menu measurably worsens tool selection. This is every tool the
  # agent has ever used plus close_position and cancel_order_by_id (used by
  # the deterministic exit path; the agent may legitimately need them).
  # The four local tools (simulate/size/record/forecast) are always bound.
  tools:
    - get_clock
    - get_account_info
    - get_account_config
    - get_all_positions
    - get_orders
    - get_order_by_id
    - get_news
    - get_stock_snapshot
    - get_stock_bars
    - get_stock_latest_quote
    - get_stock_latest_trade
    - get_option_chain
    - get_option_snapshot
    - get_option_latest_quote
    - place_option_order
    - replace_order_by_id
    - cancel_order_by_id
    - close_position
    - close_all_positions   # kept: the whole-book guard redirects it usefully

tick:
  # Cheap deterministic work every tick; the LLM decide path every N ticks
  # (D-017). The skeleton runs decide every tick so it is easy to explore.
  decide_every_n_ticks: 1
  watchdog_seconds: 300

inbox:
  # Dead-letter after N attempts so one bad item cannot stall forever (D-018).
  max_retries: 3
