# trdrbot configuration.
# The model is a config value, not a code constant (D-008) - swapping providers
# is an edit here, and every journalled decision records which model made it.

llm:
  # LangChain "provider:model" form. Model IDs are complete as-is; never append
  # a date suffix. `init_chat_model` IS the provider registry, so adding a
  # provider is a line here plus (usually) one package - no code changes.
  #
  # ORDERED FALLBACK CHAIN: first model that answers wins. Verified live that
  # an exhausted-credit 400 from one provider falls through to the next.
  #
  # gpt-5.6-sol, DIRECT on OpenAI, is the PRIMARY (2026-08-28, superseding the
  # Grok/GLM attempts below): Claude and GPT-5 stay in the chain as fallback.
  # No gateway needed - "openai:" is a real init_chat_model provider and the
  # existing OPENAI_API_KEY already covers it, which is the whole reason "on
  # OpenAI" made this the simplest of the three migrations tried today.
  #
  # ONE THING WAS NOT OBVIOUS AND WOULD HAVE SILENTLY BROKEN EVERY DECIDE
  # CALL: a live 400 named it exactly - "Function tools with reasoning_effort
  # are not supported for gpt-5.6-sol in /v1/chat/completions. To use
  # function tools, use /v1/responses or set reasoning_effort to 'none'."
  # Every role here needs bind_tools, so this is not a corner case, it is
  # the primary use. Fixed via `model_options` below with
  # `use_responses_api: true` (langchain_openai's own flag) rather than
  # `reasoning_effort: "none"`, because decide is the one role this project
  # says should never be economised on - disabling reasoning to satisfy an
  # API constraint would be exactly that. Verified live: tool call fires,
  # its RESULT reaches the final answer, and constructor-callback usage
  # tracking (D-062) still records both turns correctly under this mode.
  #
  # Grok-4.6 via OpenCode Zen tried second (2026-08-28): correct model id,
  # confirmed reachable key - but the endpoint itself returned a live HTTP
  # 500 three times running, and grok-4.5 (same family) 503'd. Zen's own
  # availability, not a config mistake. Demoted rather than removed
  # (I-25); the fallback chain is proven (not assumed) to survive a REAL
  # HTTP error, which is what makes leaving a currently-down model further
  # down this chain harmless rather than merely hopeful.
  #
  # GLM-5.2 tried first (2026-08-28): reliable for simple prompts but proven
  # to exhaust its ENTIRE completion budget on invisible reasoning tokens for
  # the muse's actual prompt - finish_reason="length", 8000/8000 output
  # tokens spent, ZERO visible characters, reproduced deterministically on a
  # ~925-token input nowhere near any context limit. Unlike a real HTTP
  # error this does NOT trigger LangChain's fallback (the call "succeeds"
  # with useless content), so it was silently producing 0 candidates every
  # muse run while it sat in this chain. No documented lever was found to
  # bound it. Demoted out of the active chain rather than deleted from
  # pricing/history.
  models:
    - "openai:gpt-5.6-sol"
    - "anthropic:claude-opus-5"
    - "openai:gpt-5"
  max_tokens: 8000

  # Config-level providers that are NOT one of init_chat_model's builtin
  # prefixes - an OpenAI-compatible gateway with its own endpoint and key.
  # `langchain_provider` names which builtin actually serves the traffic;
  # `base_url`/`api_key_env` are threaded into that provider's constructor
  # for THIS spec only, so other `openai:*` entries above are untouched.
  providers:
    opencode_zen:
      langchain_provider: "openai"
      base_url: "https://opencode.ai/zen/v1"
      api_key_env: "ZEN_API_KEY"

  # Per-EXACT-SPEC constructor kwargs, for a model's own API quirk rather
  # than a provider-wide one - keyed on the spec AS WRITTEN above, resolved
  # by the same `Config.resolve_model_spec` as `providers:`, and composed
  # with it rather than replacing it. Applying this globally (in `models`'s
  # shared kwargs) would break `ChatAnthropic`, which has no such flag, the
  # moment Claude shares a chain with gpt-5.6-sol - the identical reason
  # `providers:` exists as a per-spec mechanism rather than a global one.
  model_options:
    "openai:gpt-5.6-sol":
      use_responses_api: true

  # Optional per-role chains. A role not listed uses `models` above.
  # decide wants the strongest reasoning; the rest are synthesis and can run
  # cheaper without weakening the trade decision itself.
  roles:
    decide: ["openai:gpt-5.6-sol", "anthropic:claude-opus-5", "openai:gpt-5"]
    research: ["openai:gpt-5.6-sol", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    discovery: ["openai:gpt-5.6-sol", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    muse: ["openai:gpt-5.6-sol", "openai:gpt-5-mini", "anthropic:claude-opus-5"]
    doctor: ["openai:gpt-4o-mini"]
    # Generates challenger prompt variants for the Coach (D-088). Synthesis
    # against a deterministic scorer it cannot influence, not judgement - so
    # the cheap tier, with the synthesis tier behind it.
    coach_mutate: ["openai:gpt-5-mini", "anthropic:claude-opus-5"]
    # High-volume, low-difficulty (structured extraction, not judgement) - the
    # cheapest tier, with the synthesis tier as fallback (D-066).
    news_extract: ["openai:gpt-4o-mini", "openai:gpt-5-mini"]

  # USD per MILLION tokens. OPERATOR-SUPPLIED - verify against your provider's
  # current published rates; these are not fetched and will go stale. A model
  # missing here is reported as UNPRICED, never counted as free (D-062).
  #
  # gpt-5.6-sol figures are FROM OPENAI'S OWN DOCS PAGE (developers.openai.com/
  # api/docs/models/gpt-5.6-sol), fetched directly - the first of the three
  # models tried today with a genuine primary source rather than third-party
  # trackers. Promotional pricing, explicitly time-boxed by OpenAI through at
  # least 2026-11-21; re-check after that date. Cached input ($0.40/M) has its
  # own rate; not modelled separately here (usage.py has no cached-tier
  # concept), so real cost on a cache-heavy workload runs below this number.
  #
  # GLM-5.2 and Grok-4.6 figures sourced from third-party trackers (pricing
  # calculators, model-routing aggregators), NOT their own pricing pages
  # directly. Kept for reference even though both are currently demoted from
  # the active chain - re-verify before either is reinstated.
  pricing:
    "openai:gpt-5.6-sol": {input: 4.00, output: 20.00}
    "gpt-5.6-sol": {input: 4.00, output: 20.00}
    "opencode_zen:grok-4.6": {input: 2.00, output: 6.00}
    "grok-4.6": {input: 2.00, output: 6.00}
    "opencode_zen:glm-5.2": {input: 1.40, output: 4.40}
    "glm-5.2": {input: 1.40, output: 4.40}
    "anthropic:claude-opus-5": {input: 15.0, output: 75.0}
    "openai:gpt-5": {input: 1.25, output: 10.0}
    "openai:gpt-5-mini": {input: 0.25, output: 2.0}
    "openai:gpt-4o-mini": {input: 0.15, output: 0.60}

alpaca:
  # The MCP server runs as a local stdio subprocess (verified: Alpaca's hosted
  # MCP endpoint is OAuth-interactive-only, unusable headless).
  command: "uvx"
  args: ["alpaca-mcp-server"]
  paper: true

polymarket:
  # Macro questions whose odds move SPY. Read-only, no auth, no cost.
  # Free-text relevance search - Gamma's default ranking, deliberately
  # unsorted (sort=volume destroys relevance, verified live).
  queries:
    - "fed rate cut"
    - "us recession"
    - "cpi inflation"

research:
  # The universe the daily research cycle covers. Liquid, optionable, and
  # chosen for LOW MUTUAL CORRELATION - measured, not assumed (D-053).
  #
  # The previous universe (SPY/QQQ/NVDA) had a mean pairwise correlation of
  # 0.75 over the last 120 sessions, with SPY/QQQ at 0.92. That is one bet
  # wearing three hats: researching it produced three views on the same
  # factor, and the per-underlying risk cap could not see that.
  #
  # Measured vs SPY over the same window: XLE -0.42, XLP -0.04, XLV +0.16.
  # QQQ dropped as redundant with SPY. Discovery still nominates any liquid
  # name freely; this list is only what gets researched every day.
  universe: ["SPY", "NVDA", "XLE", "XLV", "XLP"]

events:
  # Known macro events. Dates here are RULE-DERIVED or user-verified, never
  # model memory (D-032's date discipline). Payrolls = first Friday of the
  # month - arithmetic, not recall. Note the collision: payrolls lands ON
  # the competition deadline day.
  - { date: "2026-09-04", name: "US nonfarm payrolls (first Friday - rule-derived); also the competition deadline" }

trading:
  # Operator risk appetite (D-099). 1.0 = the posture the competence ladder
  # alone would choose; clamped to [0.25, 2.0]. It scales the book cap - and
  # through it the per-name cap, the per-position cap and the exploration floor,
  # which all derive from it - plus the Kelly multiplier.
  #
  # It scales SIZE ONLY. The EV gate sits upstream of every multiplication, so
  # no setting can buy a trade that is not worth taking, and turning this down
  # does NOT make the agent decline more often - selectivity is chosen in prose,
  # in the 87 of 89 decide cycles that never call size_position (I-68).
  #
  # Takes effect on the NEXT TICK under run.sh (a fresh process per tick); needs
  # a RESTART under `trdrbot run`, which loads config once before its loop.
  # `trdrbot risk <x>` previews any value against the live book before you set
  # it, and the applied number is journalled every tick.
  #
  # 1.75, RAISED FROM 0.50 for the hackathon (D-100). This is paper money and
  # the point of the exercise is to see the machinery move under load, not to
  # maximise expected log growth on a book with zero attributed positions. The
  # measured belief table (docs/research_risk_appetite.md SS6) says the honest
  # setting for THIS record is the minimum; that answer stands and is not what
  # is wanted here. Restore 0.50 (or 0.25) when this stops being a demo.
  #
  # 1.75 AND NOT 2.00, and the difference is not cosmetic. At SCALE both give
  # the identical size today - 0.20 x 1.75 = 0.35 hits the ruin bound, so 2.00
  # realises 1.75x anyway. But after an 11% drawdown demotes the book to
  # EXPLORE, 1.75 cuts the next trade by 50% and 2.00 cuts it by only 43%,
  # because 2.00 has room left to scale a rung the ceiling was compressing.
  # Same upside, weaker brake: 2.00 is strictly worse and there is no setting
  # above 1.75 that buys anything at this rung. Verified by tracing the real
  # sizer, docs/plan_risk_appetite.md SS8.
  #
  # 0.50 was the shipping default and the reason is worth keeping: deriving the
  # exploration floor from the tier raised it from a flat 2.2% to 4.4% at
  # SCALE, and 0.50 x that is 2.2% - so D-099 landed the MECHANISM with the
  # live book's size unchanged, and any behaviour change was a bug rather than
  # the knob. That verification is done; this is a deliberate move off it.
  #
  # NOT a Coach lever, ever: the Coach writes only data/state/levers/, and the
  # measured/measurer rule (specs/notes/015) forbids anything it can move from
  # scoring its own trial. This is the principal's preference, not the agent's.
  risk_appetite: 1.75

  # The names quoted to the agent every cycle and the scope of the news feed.
  # NOT a restriction on what may be traded - nothing in tool_guard, sizing or
  # the order path filters by symbol, and the book has traded NVDA. It was read
  # as a restriction for the whole run because it appeared under a prompt
  # heading called "Constraints" (D-102); the prompt now says what is true.
  # Kept in step with research.universe so the two cannot disagree.
  watchlist: ["SPY", "NVDA", "XLE", "XLV", "XLP"]
  # A hard stop: force-close everything on/after this date regardless of
  # position expiry (D-019). `null` means run indefinitely (D-101).
  #
  # REMOVED 2026-09-01: the judges set no requirement to stop, so the run
  # continues and positions are closed by their own exit rules rather than by a
  # calendar. This removes ONE thing - the sweep - and deliberately nothing
  # else. `can_open` goes inert, the deadline exit rule reads an unobservable
  # signal and holds (it never fires blind), and `trdrbot run` loops until it
  # is stopped.
  #
  # What it must NOT remove is the forecast horizon window. That window used to
  # be derived from this date, and every caller carried its own fallback for
  # when it was absent - the muse's was the literal string "10 days out", the
  # exact 1-10 day range D-070 deleted after its output clustered at the far
  # end. Deleting the deadline would have silently reinstated the bug the
  # deadline was masking. `competence.forecast_window` now always returns a
  # window (MAX_HORIZON_DAYS = 10) and a hard stop only TIGHTENS it.
  #
  # Set a date back here to re-arm the sweep; a typo raises at startup rather
  # than being read as "no deadline".
  deadline: null

decide:
  # Tools bound to the decide agent. Binding all 72 MCP tools cost ~21k tokens
  # of schemas PER LLM CALL, ~71% of it for tools never used once - and a
  # larger tool menu measurably worsens tool selection. This is every tool the
  # agent has ever used plus close_position and cancel_order_by_id (used by
  # the deterministic exit path; the agent may legitimately need them).
  # The four local tools (simulate/size/record/forecast) are always bound.
  tools:
    - get_clock
    - get_account_info
    - get_account_config
    - get_all_positions
    - get_orders
    - get_order_by_id
    - get_news
    - get_stock_snapshot
    - get_stock_bars
    - get_stock_latest_quote
    - get_stock_latest_trade
    - get_option_chain
    - get_option_snapshot
    - get_option_latest_quote
    - place_option_order
    - replace_order_by_id
    - cancel_order_by_id
    - close_position
    - close_all_positions   # kept: the whole-book guard redirects it usefully

tick:
  # Cheap deterministic work every tick; the LLM decide path every N ticks
  # (D-017). The skeleton runs decide every tick so it is easy to explore.
  decide_every_n_ticks: 1
  # Bounds the decide call (tick.py), and x4 bounds the whole tick from the
  # run loop (FM-26). Read by nothing at all until D-091, so a hung LLM call
  # stalled an unattended run indefinitely. 600 rather than the original 300
  # because measured decide cycles have reached 5:19 of wall clock (D-074) -
  # a watchdog that kills legitimate work is worse than none.
  watchdog_seconds: 600

inbox:
  # Dead-letter after N attempts so one bad item cannot stall forever (D-018).
  max_retries: 3

coach:
  # The autonomous self-improvement loop (D-088). It runs paired A/B trials on
  # DECLARED levers (currently only the muse's collision prompt), scores them
  # with the subsystem's own deterministic gates, and promotes a winner without
  # asking. That is the intended trade for a paper-trading hackathon: human
  # approval gates block the feedback loop, and every change it makes is data
  # under data/state/levers/ that reverts by editing one file.
  #
  # STEERING, not gating: set `paused: true` or `pinned: true` inside a lever's
  # own state file to stop experimentation on it (demo day is one pin), and
  # read `trdrbot report` for the trajectory. Nothing here can touch code, gate
  # thresholds, sizing, or elfmem's constitution - those are outside the lever
  # space by construction, not by policy.
  enabled: true

  # Promotion evidence. The unit is a CANDIDATE (~5 per muse run through ~8
  # gates), so 8 runs is ~40 Bernoulli trials per arm. The RUN floor stops one
  # freak run carrying a promotion; the CANDIDATE floor stops 8 runs of one
  # candidate each from counting as 8 runs' worth of evidence.
  min_runs: 8
  min_candidates: 24
  promote_at: 0.90        # P(challenger better) required to swap
  futility_at: 0.05       # stop paying for a loser this far behind
  futility_min_runs: 6
  cap_runs: 40            # no verdict by here: the incumbent keeps its place

  # Sentinels - the autonomic brake. Deterministic, checked every pulse.
  cost_ceiling_usd_per_day: 10.0   # muse + coach_mutate roles, this UTC day
  churn_max_promotions_per_day: 2
  # The muse's mandate is RANDOM collision. A sampling policy optimised purely
  # for gate survival could converge on one productive pair and quietly stop
  # being a muse, so the diversity of what it collides is measured and floored.
  entropy_min_type_pairs: 3
